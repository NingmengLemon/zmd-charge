name: Build Portable

on:
  push:
    branches: [ main ]
    # 推送 v* 标签时额外发布 GitHub Release
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 打标签时创建 Release 需要

jobs:
  build:
    name: build (${{ matrix.rid }})
    # 两个平台都编一遍。跨平台之后只在 Windows 上过 CI 等于没验 Linux。
    strategy:
      # 一个平台挂了也要能看到另一个平台的结果，别让它被取消掉
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # 需要完整 tag 历史：主干构建用 `git describe --tags --abbrev=0` 取最近 tag 作版本基线
        fetch-depth: 0

    # SDK 版本以 global.json 为唯一真源，避免 CI 与本地各钉一个版本。
    # NuGet 缓存按 Directory.Packages.props 的内容做键：包版本集中在那里，
    # 它没变就没必要重新下载。
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: Directory.Packages.props

    # ---- 版本号与更新源 ----
    # 版本号必须在 build 之前解析：程序集版本参与编译，应用内「检查更新」靠它比较。
    #   tag 构建   : 1.1.1
    #   主干构建   : <最近 tag>.<run_number>，例如 1.1.1.500
    #                第 4 段让主干构建"比同名 tag 新"，否则 0.0.N < 1.1.1 会让
    #                应用一直提示更新、并把用户带到比当前代码更旧的发布版。
    #                仓库里一个 tag 都没有时（fork 常见）退化成 0.0.<run_number>。
    # 更新源用 github.repository，任何 fork 的 CI 产物都查自己的 Release。
    # 两个平台各跑一次这个 step，结果一致（同一个 run_number、同一份 tag 历史）。
    - name: Resolve version and update source
      id: ver
      shell: pwsh
      run: |
        # 探测最近 tag。仓库里没有 tag 时 git describe 必然以非 0 退出，这是预期内的分支；
        # 但 runner 给 shell: pwsh 生成的脚本末尾会追加
        #   if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }
        # 于是那次预期内的失败会把整个 step 判成失败（实测复现：脚本把版本正确打印出来了，
        # step 仍然以 1 退出）。所以探完必须显式归零，且只归零这一处。
        $last = git describe --tags --abbrev=0 2>$null
        $hasTag = $LASTEXITCODE -eq 0
        $global:LASTEXITCODE = 0

        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
        } elseif ($hasTag -and $last) {
          $base = ($last -replace '^v', '') -replace '-.*$', ''
          $v = $base + "." + $env:GITHUB_RUN_NUMBER
        } else {
          Write-Host "::warning::仓库里没有任何 tag，主干版本退化为 0.0.$env:GITHUB_RUN_NUMBER"
          $v = "0.0." + $env:GITHUB_RUN_NUMBER
        }
        $owner, $repo = $env:GITHUB_REPOSITORY -split '/', 2
        "version=$v" >> $env:GITHUB_OUTPUT
        "owner=$owner"   >> $env:GITHUB_OUTPUT
        "repo=$repo"     >> $env:GITHUB_OUTPUT
        Write-Host "Version: $v   Update source: $owner/$repo"

    - name: Restore
      run: dotnet restore

    - name: Build (Release)
      # ContinuousIntegrationBuild 把 PDB 里的路径归一化，让产物可复现
      run: dotnet build -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.ver.outputs.version }} /p:UpdateRepoOwner=${{ steps.ver.outputs.owner }} /p:UpdateRepoName=${{ steps.ver.outputs.repo }}

    # 纯逻辑单元测试。用 Debug（主干项目只在 Release 设 RID），
    # 避免覆盖上面 Release 的输出、影响后面 --no-build 的 publish。
    # xunit v3 走 Microsoft.Testing.Platform（见 global.json 的 test.runner），
    # 这个模式下必须用 --project 指定工程，不能像 VSTest 模式那样直接传路径。
    # 路径一律用正斜杠：Windows 与 Linux 都能吃，不必分平台写两份。
    - name: Test
      run: dotnet test --project tests/EndfieldCharge.Tests -c Debug

    - name: Publish single-file
      run: dotnet publish -c Release -o publish --no-build

    # 打包必须分平台：Windows 的产物是 exe，Linux 没有扩展名；压缩格式也不同。
    # 两个平台都必须带上 SkiaSharp 的 native 库（libSkiaSharp / libHarfBuzzSharp，
    # Windows 还多一个 ANGLE 的 av_libglesv2），只打可执行文件会导致启动即崩。
    # pdb 是调试符号；xml 是 GenerateDocumentationFile 的产物（只为启用 IDE0005），
    # 便携包都不需要。
    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $v = "${{ steps.ver.outputs.version }}"
        $exe = "publish/EndfieldCharge.exe"
        if (!(Test-Path $exe)) {
          Write-Error "$exe not found"
          exit 1
        }
        $stage = "EndfieldCharge-$v-${{ matrix.rid }}"
        New-Item -ItemType Directory -Path $stage | Out-Null
        Copy-Item "publish/*" -Destination $stage -Exclude "*.pdb", "*.xml"
        Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"
        Remove-Item $stage -Recurse

    - name: Package (Linux)
      if: runner.os == 'Linux'
      shell: pwsh
      run: |
        $v = "${{ steps.ver.outputs.version }}"
        $exe = "publish/EndfieldCharge"
        if (!(Test-Path $exe)) {
          Write-Error "$exe not found"
          exit 1
        }
        $stage = "EndfieldCharge-$v-${{ matrix.rid }}"
        New-Item -ItemType Directory -Path $stage | Out-Null
        Get-ChildItem "publish" -File |
          Where-Object { $_.Extension -notin @('.pdb', '.xml') } |
          Copy-Item -Destination $stage
        # 用 tar.gz 而不是 zip：tar 保留可执行位，zip 不保留
        tar -czf "$stage.tar.gz" -C $stage .
        Remove-Item $stage -Recurse

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: EndfieldCharge-${{ steps.ver.outputs.version }}-${{ matrix.rid }}
        # 用 rid 拼通配：写死两个平台的扩展名会在另一个平台上匹配不到而触发
        # if-no-files-found: error
        path: EndfieldCharge-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.*
        if-no-files-found: error

  # 发 Release 单独一个 job：两个平台的构建是并发跑的，各自去创建同一个 Release 会打架
  # （action-gh-release 遇到已存在的 Release 走更新路径，并发时可能撞 422）。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Resolve version
      id: ver
      shell: pwsh
      run: |
        $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
        "version=$v" >> $env:GITHUB_OUTPUT
        Write-Host "Release version: $v"

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    # 只有推送 v* 标签才发 Release（标签由维护者手动创建）
    # v3 起运行时是 Node 24；v2 线仍跑在已弃用的 Node 20 上（runner 会给出 deprecation 警告）
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: EndfieldCharge ${{ steps.ver.outputs.version }}
        generate_release_notes: true
        files: dist/*
