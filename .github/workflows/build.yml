name: Build Portable

on:
  push:
    branches: [ main ]
    # 推送 v* 标签时额外发布 GitHub Release
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 打标签时创建 Release 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # 需要完整 tag 历史：主干构建用 `git describe --tags --abbrev=0` 取最近 tag 作版本基线
        fetch-depth: 0

    # SDK 版本以 global.json 为唯一真源，避免 CI 与本地各钉一个版本
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    # ---- 版本号与更新源 ----
    # 版本号必须在 build 之前解析：程序集版本参与编译，应用内「检查更新」靠它比较。
    #   tag 构建   : 1.1.1
    #   主干构建   : <最近 tag>.<run_number>，例如 1.1.1.500
    #                第 4 段让主干构建"比同名 tag 新"，否则 0.0.N < 1.1.1 会让
    #                应用一直提示更新、并把用户带到比当前代码更旧的发布版。
    # 更新源用 github.repository，任何 fork 的 CI 产物都查自己的 Release。
    - name: Resolve version and update source
      id: ver
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
        } else {
          $last = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -eq 0 -and $last) {
            $base = ($last -replace '^v', '') -replace '-.*$', ''
            $v = $base + "." + $env:GITHUB_RUN_NUMBER
          } else {
            $v = "0.0." + $env:GITHUB_RUN_NUMBER
          }
        }
        $owner, $repo = $env:GITHUB_REPOSITORY -split '/', 2
        "version=$v" >> $env:GITHUB_OUTPUT
        "owner=$owner"   >> $env:GITHUB_OUTPUT
        "repo=$repo"     >> $env:GITHUB_OUTPUT
        Write-Host "Version: $v   Update source: $owner/$repo"

    - name: Restore
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build -c Release --no-restore /p:Version=${{ steps.ver.outputs.version }} /p:UpdateRepoOwner=${{ steps.ver.outputs.owner }} /p:UpdateRepoName=${{ steps.ver.outputs.repo }}

    # 纯逻辑单元测试。用 Debug（主干项目只在 Release 设 RID），
    # 避免覆盖上面 Release 的输出、影响后面 --no-build 的 publish。
    - name: Test
      run: dotnet test tests\EndfieldCharge.Tests -c Debug

    - name: Publish single-file
      run: dotnet publish -c Release -o publish --no-build

    - name: Create portable zip
      shell: pwsh
      run: |
        $v = "${{ steps.ver.outputs.version }}"
        if (!(Test-Path "publish\EndfieldCharge.exe")) {
          Write-Error "publish\EndfieldCharge.exe not found"
          exit 1
        }
        # 必须包含 SkiaSharp native dll（libSkiaSharp / libHarfBuzzSharp / av_libglesv2），
        # 只打 exe 会导致启动即崩
        $stage = "EndfieldCharge-$v-portable"
        New-Item -ItemType Directory -Path $stage | Out-Null
        Copy-Item "publish\*" -Destination $stage -Exclude "*.pdb"
        Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip"
        Remove-Item $stage -Recurse

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: EndfieldCharge-${{ steps.ver.outputs.version }}
        path: EndfieldCharge-*-portable.zip
        if-no-files-found: error

    # 只有推送 v* 标签才发 Release（标签由维护者手动创建）
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: EndfieldCharge ${{ steps.ver.outputs.version }}
        generate_release_notes: true
        files: EndfieldCharge-*-portable.zip
